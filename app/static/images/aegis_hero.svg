<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101214" />
      <stop offset="50%" stop-color="#181C20" />
      <stop offset="100%" stop-color="#20262B" />
    </linearGradient>
    <radialGradient id="lime-signal" cx="72%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#B8F36B" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#80B9C8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cold-drift" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#80B9C8" stop-opacity="0.10" />
      <stop offset="80%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="station-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#343D42" stroke-opacity="0.25" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="700" fill="url(#bg-grad)" />
  <rect width="1200" height="700" fill="url(#station-grid)" />
  <rect width="1200" height="700" fill="url(#lime-signal)" />
  <rect width="1200" height="700" fill="url(#cold-drift)" />

  <!-- Station Superstructure Silhouette -->
  <g opacity="0.45" stroke="#343D42" stroke-width="1.5" fill="none">
    <!-- Huge orbital foundry ring -->
    <circle cx="850" cy="280" r="320" stroke-dasharray="8 6" />
    <circle cx="850" cy="280" r="280" stroke-opacity="0.4" />
    <circle cx="850" cy="280" r="160" stroke="#B8F36B" stroke-opacity="0.5" stroke-width="2" />

    <!-- Spoke trusses -->
    <line x1="850" y1="-40" x2="850" y2="600" />
    <line x1="530" y1="280" x2="1170" y2="280" />
    <line x1="623" y1="53" x2="1076" y2="506" />
    <line x1="623" y1="506" x2="1076" y2="53" />

    <!-- Bulkhead Girders Foreground -->
    <polygon points="0,700 0,520 220,620 450,560 620,700" fill="#101214" stroke="#252D33" />
    <polygon points="1200,700 1200,480 980,580 820,530 600,700" fill="#0D0F12" stroke="#252D33" />
  </g>

  <!-- Technical Telemetry Overlays -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#A4ADB1" letter-spacing="2">
    <text x="60" y="80">SIGNAL_REF: CSS-TX-904 // ANOTHER_WORLD</text>
    <text x="60" y="100">TELEMETRY_DELTA: STABLE_CARRIER [440.18 MHz]</text>
    <text x="900" y="80">BEACON_STATUS: LOCK_CONFIRMED</text>
    <line x1="60" y1="120" x2="380" y2="120" stroke="#B8F36B" stroke-width="1.5" stroke-opacity="0.9" />
  </g>

  <!-- Atmospheric Acid-Lime Focal Reticle -->
  <circle cx="850" cy="280" r="5" fill="#B8F36B" />
  <circle cx="850" cy="280" r="16" stroke="#B8F36B" stroke-width="1" stroke-opacity="0.7" stroke-dasharray="3 3" />
</svg>
