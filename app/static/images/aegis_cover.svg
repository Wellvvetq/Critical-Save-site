<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="c-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101214" />
      <stop offset="50%" stop-color="#181C20" />
      <stop offset="100%" stop-color="#101214" />
    </linearGradient>
    <radialGradient id="ring-rad" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#B8F36B" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#101214" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#c-bg)" />
  <rect width="800" height="1000" fill="url(#ring-rad)" />

  <!-- Industrial Frame Graphics -->
  <rect x="30" y="30" width="740" height="940" fill="none" stroke="#262E34" stroke-width="1.5" />
  <rect x="45" y="45" width="710" height="910" fill="none" stroke="#1D2429" stroke-width="1" stroke-dasharray="6 4" />

  <!-- Structural Geometry -->
  <g transform="translate(400, 420)" stroke="#B8F36B" fill="none" stroke-width="1.5">
    <circle r="220" stroke="#343D42" stroke-width="3" />
    <circle r="180" stroke-dasharray="12 8" />
    <polygon points="0,-160 138,80 -138,80" stroke="#B8F36B" stroke-width="2" />
    <circle r="50" fill="#181C20" stroke="#B8F36B" stroke-width="2.5" />
    <line x1="0" y1="-260" x2="0" y2="260" stroke="#2B343A" />
    <line x1="-260" y1="0" x2="260" y2="0" stroke="#2B343A" />
  </g>

  <!-- Typography & Decals -->
  <text x="400" y="760" font-family="'Cinzel', serif" font-size="44" font-weight="800" fill="#F1F3EE" text-anchor="middle" letter-spacing="8">AEGIS DECAY</text>
  <text x="400" y="805" font-family="'Inter', sans-serif" font-size="14" fill="#B8F36B" text-anchor="middle" letter-spacing="4">TACTILE ORBITAL SURVIVAL</text>
  <text x="400" y="835" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A4ADB1" text-anchor="middle">CRITICAL SAVE STUDIO // ORB-FOUNDRY VII</text>
</svg>
